[workspace]
resolver = "2"
members = [
    "chime-core",
    "chime-codec-pcm",
    "chime-codec-dsd",
    "chime-codec-dst",
    "chime-dsp",
    "chime-output",
    "chime-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
bytes = "1"
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
clap = { version = "4", features = ["derive"] }
num-traits = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
byteorder = "1"

# Release build optimizations for audio DSP performance
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = 3